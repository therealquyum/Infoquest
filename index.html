<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>practice</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:title" content="Challenge Your Library Knowledge" />
  <meta property="og:description" content="Practice today's lecture through quiz" />
  <meta property="og:image" content="https://cylk.netlify.app/iq.png" />
  <meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://cylk.netlify.app" />
  <meta property="og:type" content="website" />

  
</head>

<body>
  <div class="container">
    <div class="progressBar" id="progressBar">
      <p id="percentUpdate"></p>
    </div>
    <p id="questionNo"></p>
    <div class="question-box">
      <h2 id="question">Question Here</h2>
    </div>
    <div class="optionsBox" id="optionsBox"></div><br>

    <div class="controls-btn">
      <button onclick="previousQuestion()"><i class="fa-solid fa-arrow-left"></i></button>
      <button onclick="submitQuiz()">Submit <i class="fa-solid fa-paper-plane"></i></button>
      <button onclick="nextQuestion()"><i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <div class="restartBtn">
      <button id="restartBtn" onclick="restartQuiz()" style="display:none;">Restart Quiz</button>
    </div>

    <hr>
    <h1 class="score" id="score"></h1>
  </div>

  <script src="script.js"></script>
</body>

</html>

];
// ==== VARIABLES ====
let currentPage = 0;
let questionsPerPage = 10;
let userAnswers = new Array(quiz.length);

// ==== FUNCTIONS ====
function loadQuestions() {
  let start = currentPage * questionsPerPage;
  let end = Math.min(start + questionsPerPage, quiz.length);
  let pageQuestions = quiz.slice(start, end);

  let container = document.getElementById("quiz-container");
  container.innerHTML = "";

  pageQuestions.forEach((q, index) => {
    let questionDiv = document.createElement("div");
    questionDiv.className = "question";

    questionDiv.innerHTML = `
      <p>${start + index + 1}. ${q.question}</p>
      ${q.options.map(option => `
        <label>
          <input type="radio" name="q${start + index}" value="${option}" ${userAnswers[start + index] === option ? "checked" : ""}>
          ${option}
        </label><br>
      `).join("")}
    `;
    container.appendChild(questionDiv);
  });
}

function saveAnswers() {
  let start = currentPage * questionsPerPage;
  let end = Math.min(start + questionsPerPage, quiz.length);

  for (let i = start; i < end; i++) {
    let selected = document.querySelector(`input[name="q${i}"]:checked`);
    userAnswers[i] = selected ? selected.value : null;
  }
}

function nextPage() {
  saveAnswers();
  if ((currentPage + 1) * questionsPerPage < quiz.length) {
    currentPage++;
    loadQuestions();
  }
}

function prevPage() {
  saveAnswers();
  if (currentPage > 0) {
    currentPage--;
    loadQuestions();
  }
}

function finishQuiz() {
  saveAnswers();
  let score = 0;
  for (let i = 0; i < quiz.length; i++) {
    if (userAnswers[i] === quiz[i].answer) score++;
  }
  document.getElementById("result").innerHTML = `<h2>Your score: ${score} / ${quiz.length}</h2>`;
}

// ==== INITIAL LOAD ====
loadQuestions();
</script>
